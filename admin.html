function contentTab(){const fsn=FSERR&&CATS.includes(TAB)?`<div class="note">⚠️ Cannot reach Firestore (${e(FSERR)}). Create the Firestore database and publish the Firestore rules, then reload this page.</div>`:"";
 const note=SEEDED?"":`<div class="note">Firebase has no content yet, so you're seeing the app's built-in defaults. Press <b>Save</b> once to publish everything to Firebase; after that the app reads everything from here.</div>`;
 return `${note}${fsn}<div class="savebar ${DIRTY[TAB]?"un":""}" id="sbar"><span class="s">${DIRTY[TAB]?"Unsaved changes":"All changes saved"}</span><button class="pri" data-a="save">Save to Firebase</button></div>`+T[TAB]()}
async function save(){
 const first=!SEEDED,secs=first?["banners","subjects","full","pyq","plans","pay","settings","quiz"]:SECS[TAB],rt={},ct={};
 secs.forEach(k=>{(CATS.includes(k)?ct:rt)[k]=clean(S[k])});
 try{
  /* mock-test catalogue (subjects / full mocks / PYQ) -> Firestore catalog/main */
  if(Object.keys(ct).length)await FS.setDoc(FS.doc(fdb,"catalog","main"),{...ct,updatedAt:Date.now()},{merge:true});
  /* everything else (banners, plans, UPI, quiz, settings) -> Realtime Database content/ */
  if(Object.keys(rt).length||first){const up={};Object.keys(rt).forEach(k=>{up["content/"+k]=rt[k]});up["content/meta"]={seeded:true,updatedAt:Date.now()};await update(ref(db),up)}
  SEEDED=true;DIRTY[TAB]=0;toast("Saved ✓ – app updates instantly");render()}
 catch(x){toast(/permission/i.test(x.code||"")?"Permission denied – check database / Firestore rules and admin UID":"Save failed: "+x.message)}}
const markDirty=()=>{if(!SECS[TAB])return;DIRTY[TAB]=1;const b=$("#sbar");if(b){b.classList.add("un");b.firstElementChild.textContent="Unsaved changes"}};

async function showShot(id,b){const host=b.closest(".shotbox");try{b.textContent="Loading…";const s=await get(ref(db,"paymentShots/"+id)),v=s.val();if(!v||!v.img){host.innerHTML='<div class="mu">Screenshot not found.</div>';return}SHOTS[id]=v.img;const r=PR.find(x=>x.id==id)||{id,shot:1};host.outerHTML=shotHtml(r)}catch(x){b.textContent="📎 View payment screenshot";toast("Can't load screenshot: "+(x.code||x.message))}}
function payList(){
 const q=PQ.trim().toLowerCase();
 const l=PR.filter(r=>(PF=="all"||r.status==PF)&&(!q||[r.uid,r.email,r.name,r.utr,r.plan].some(x=>String(x||"").toLowerCase().includes(q))));
 if(!l.length)return `<div class="card mu" style="text-align:center">No ${PF=="all"?"":PF+" "}payment requests</div>`;
 return l.map(r=>{const st=r.status;return `<div class="card"><div class="row"><b>${e(r.name||"User")}</b><span class="tag ${st=="approved"?"ok":st=="rejected"?"bad":"w"}">${e(String(st).toUpperCase())}</span><span class="sp"></span><span class="mu">${fmt(r.ts)}</span></div>
 <div class="kv"><b>Email</b>${e(r.email)}</div>
 <div class="kv"><b>UID</b><code>${e(r.uid)}</code><button class="cp" data-a="cp" data-v="${e(r.uid)}">copy</button></div>
 <div class="kv"><b>Plan</b>${e(r.plan)} · <b style="color:var(--tx)">₹${e(r.amt)}</b></div>
 <div class="kv"><b>UTR</b><code>${e(r.utr)}</code><button class="cp" data-a="cp" data-v="${e(r.utr)}">copy</button></div>
 ${RF[r.uid]&&!RF[r.uid].rewarded?`<div class="kv"><b>🎁 Referred by</b>${who(RF[r.uid].by)}</div>`:""}
 ${shotHtml(r)}
 ${st=="approved"&&r.exp?`<div class="kv"><b>Valid till</b>${fmtD(r.exp)}</div>`:""}
 ${st=="pending"?`<div class="acts"><button class="good" data-a="appr" data-id="${e(r.id)}">Approve · ${defDays(r)} days</button><button class="ghost" data-a="custom" data-id="${e(r.id)}">Custom duration…</button><button class="danger" data-a="rej" data-id="${e(r.id)}">Reject</button></div>`:""}</div>`}).join("")}
function payTab(){

 return `<div class="chips">${[["pending","Pending "+c("pending")],["approved","Approved"],["rejected","Rejected"],["all","All"]].map(x=>`<button data-a="pf" data-v="${x[0]}" class="${PF==x[0]?"on":""}">${x[1]}</button>`).join("")}</div><input class="f" id="pq" placeholder="Search by UID, email, name or UTR" value="${e(PQ)}" style="margin-bottom:12px"><div id="plist">${payList()}</div>`}
async function doApprove(r,n,u,ask){
 const rf=RF[r.uid],canRew=!!(rf&&!rf.rewarded&&r.pid!="trial"),rd=Math.max(1,+S.settings.refDays||7);
 const sub=SUBS[r.uid],now=Date.now(),base=sub&&sub.exp>now&&sub.id==r.pid?sub.exp:now,exp=addDur(base,n,u);
 if(ask&&!confirm(`Approve ${r.plan} for ${r.name||r.email}?\nAccess valid till ${fmtD(exp)}${base>now?" (added to current plan)":""}.${canRew?`\n\nThe friend who referred this user will also get ${rd} free days.`:""}`))return false;
 const up={};up[`subs/${r.uid}`]={id:r.pid,exp,since:now,by:ME.uid};if(r.pid=="trial")up[`flags/${r.uid}/trial`]=true;if(canRew)Object.assign(up,refRewardPaths(rf.by,r.uid,now));
 for(const b of [`paymentRequests/${r.id}`,`payments/${r.uid}/${r.id}`]){up[b+"/status"]="approved";up[b+"/approvedAt"]=now;up[b+"/exp"]=exp}
 try{await update(ref(db),up);toast("Approved ✓ valid till "+fmtD(exp));return true}catch(x){toast("Failed: "+x.message);return false}}
async function doReject(r){
 if(!confirm(`Reject this payment from ${r.name||r.email}?`))return;
 const up={};for(const b of [`paymentRequests/${r.id}`,`payments/${r.uid}/${r.id}`]){up[b+"/status"]="rejected";up[b+"/rejectedAt"]=Date.now()}up["utrs/"+r.utr]=null;up["payDay/"+r.uid]=null;
 try{await update(ref(db),up);toast("Rejected")}catch(x){toast("Failed: "+x.message)}}
function durModal(title,sub,plans,defId,onOk){
 const d0=(plans.find(p=>p.id==defId)||plans[0]||{}).days||30;
 const m=modal(`<h3>${title}</h3><div class="mu">${sub}</div>${plans.length>1||!defId?`<label>Plan</label><select class="f" id="dp">${plans.map(p=>`<option value="${e(p.id)}" ${p.id==defId?"selected":""}>${e(p.n)} · ₹${e(p.pr)}</option>`).join("")}</select>`:""}
 <label>Duration</label><div class="two"><input class="f" id="dn" type="number" min="1" value="${d0}"><select class="f" id="du"><option value="days">Days</option><option value="months">Months</option><option value="years">Years</option></select></div>
 <div class="mrow"><button class="ghost" data-x="cancel">Cancel</button><button class="pri" id="dok">Confirm</button></div>`);
 const dp=m.querySelector("#dp");if(dp)dp.onchange=()=>{m.querySelector("#dn").value=(plans.find(p=>p.id==dp.value)||{}).days||30;m.querySelector("#du").value="days"};
 m.querySelector("#dok").onclick=async()=>{const n=Math.floor(+m.querySelector("#dn").value);if(!(n>0))return toast("Enter a valid duration");if(await onOk(dp?dp.value:defId,n,m.querySelector("#du").value))m.remove()}}

/* ---------- uploaded HTML mocks (Firestore: mocks/{id} + mocks/{id}/parts/{n}) ---------- */
const CHUNK=240000,MAXMB=5;
async function putMock(file,title,oldMid){
 if(file.size>MAXMB*1048576)throw new Error("File is over "+MAXMB+" MB");
 const txt=await file.text();if(!/<\w+[\s>]/.test(txt))throw new Error("This does not look like an HTML file");
 const mid=oldMid||FS.doc(FS.collection(fdb,"mocks")).id,parts=[];
 for(let i=0;i<txt.length;){let j=Math.min(txt.length,i+CHUNK);if(j<txt.length){const c=txt.charCodeAt(j-1);if(c>=0xD800&&c<=0xDBFF)j--}parts.push(txt.slice(i,j));i=j}
 let oldParts=0,created=Date.now();
 if(oldMid){const m=await FS.getDoc(FS.doc(fdb,"mocks",mid));if(m.exists()){oldParts=m.data().parts||0;created=m.data().createdAt||created}}
 for(let i=0;i<parts.length;i+=3){const b=FS.writeBatch(fdb);parts.slice(i,i+3).forEach((d,k)=>b.set(FS.doc(fdb,"mocks",mid,"parts",String(i+k).padStart(4,"0")),{n:i+k,d}));await b.commit()}
 if(oldParts>parts.length){const b=FS.writeBatch(fdb);for(let i=parts.length;i<oldParts;i++)b.delete(FS.doc(fdb,"mocks",mid,"parts",String(i).padStart(4,"0")));await b.commit()}
 await FS.setDoc(FS.doc(fdb,"mocks",mid),{title:String(title||file.name).slice(0,120),fn:file.name.slice(0,120),size:file.size,parts:parts.length,rev:Date.now(),createdAt:created,by:ME.uid});
 return mid}

 try{const mid=await putMock(file,t.t||file.name,t.mid||"");t.mid=mid;t.fn=file.name;t.sz=file.size;MF=null;markDirty();render();toast("Uploaded ✓ – press Save to publish")}
 catch(x){toast("Upload failed: "+(x.code||x.message))}}
async function uploadMany(p,k,files){const arr=get_(p),errs=[];let n=0;

 if(a=="openchat")return openChat(id);
 if(a=="closechat"){CHATOPEN="";if(chatUnsub){chatUnsub();chatUnsub=null}return render()}
 if(a=="sendreply")return sendReply();
 if(a=="rewardref")return rewardNow(id);
 if(a=="shot")return showShot(id,b);
 if(a=="shotbig"){if(SHOTS[id])modal(`<img src="${SHOTS[id]}" style="width:100%;border-radius:12px"><div class="mrow"><button class="ghost" data-x="cancel">Close</button></div>`);return}
 if(a=="appr"&&r)return doApprove(r,defDays(r),"days");

 if(a=="revoke"){if(!confirm("Remove this user's plan (back to Free)?"))return;set(ref(db,"subs/"+id),null).then(()=>toast("Plan removed"),x=>toast("Failed: "+x.message))}});
function bulkQ(p){const arr=get_(p);const m=modal(`<h3>Bulk add questions</h3><div class="mu">One per line:<br><code>Question | A | B | C | D | correct (A-D) | subject</code></div><textarea class="f" id="bk" rows="9" style="margin-top:10px" placeholder="15% of 240 = ? | 24 | 32 | 36 | 40 | C | Maths"></textarea><div class="mrow"><button class="ghost" data-x="cancel">Cancel</button><button class="pri" id="bok">Add</button></div>`);
 m.querySelector("#bok").onclick=()=>{let n=0;m.querySelector("#bk").value.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(x=>x.length>=5&&x[0]).forEach(x=>{const c=(x[5]||"A").toUpperCase(),ai=/^[A-D]$/.test(c)?"ABCD".indexOf(c):Math.min(3,Math.max(0,(+c||1)-1));arr.push({s:x[6]||"General",q:x[0],o:x.slice(1,5),a:ai});n++});m.remove();if(n){markDirty();render();toast(n+" added")}else toast("No valid lines (need a question and 4 options)")}}

function showLogin(m){$("#app").hidden=true;$("#login").hidden=false;$("#lerr").textContent=m||""}
$("#lf").onsubmit=async ev=>{ev.preventDefault();$("#lerr").textContent="";const em=$("#le").value.trim(),pw=$("#lp").value;if(!em||!pw)return $("#lerr").textContent="Enter email and password.";
 try{await Au.signInWithEmailAndPassword(auth,em,pw)}catch(x){$("#lerr").textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Wrong email or password.":x.code=="auth/operation-not-allowed"?"Enable Email/Password sign-in in Firebase Authentication first.":x.message}};
$("#out").onclick=()=>Au.signOut(auth);
async function reload(){const s=await get(ref(db,"content"));FSERR="";CATDATA=null;
 try{const c=await FS.getDoc(FS.doc(fdb,"catalog","main"));if(c.exists())CATDATA=c.data()}catch(x){FSERR=x.code||x.message}
 S=build(s.val(),CATDATA);const v=s.val();CATLEGACY=!!(SEEDED&&!CATDATA&&!FSERR&&v&&(v.subjects||v.full||v.pyq))}
let CATLEGACY=false;
/* one-time: copy the old Realtime Database mock catalogue into Firestore */
async function migrateCat(){if(!CATLEGACY)return;
 try{await FS.setDoc(FS.doc(fdb,"catalog","main"),{subjects:clean(S.subjects),full:clean(S.full),pyq:clean(S.pyq),updatedAt:Date.now()},{merge:true});CATLEGACY=false;toast("Mock tests moved to Firestore ✓")}
 catch(x){FSERR=x.code||x.message;toast("Couldn't move mock tests to Firestore: "+FSERR)}}
Au.onAuthStateChanged(auth,async u=>{
 live.forEach(f=>f());live=[];ME=null;S=null;
 if(!u){showLogin(LASTMSG);LASTMSG="";return}
 let ok=false;try{await get(ref(db,"paymentRequests"));ok=true}catch(x){}
 if(!ok){LASTMSG=`This account is not an admin yet.\nYour UID: ${u.uid}\nIn Firebase → Realtime Database, add  admins → ${u.uid} = true  then sign in again.`;return Au.signOut(auth)}
 ME=u;$("#who").textContent=u.email;
 try{await reload()}catch(x){LASTMSG="Could not load content: "+x.message;return Au.signOut(auth)}
 await migrateCat();$("#login").hidden=true;$("#app").hidden=false;render();
 live.push(onValue(ref(db,"paymentRequests"),s=>{PR=[];s.forEach(c=>{PR.push(c.val())});PR.sort((a,b)=>b.ts-a.ts);
   if(TAB=="payments"){document.activeElement&&document.activeElement.id=="pq"?($("#plist").innerHTML=payList(),drawTabs()):render()}else{drawTabs();if(TAB=="over")render()}},x=>toast("Can't read payments: "+x.code)));
 live.push(onValue(ref(db,"referrals"),s=>{RF=s.val()||{};if(TAB=="refs")render()},()=>{}));
 live.push(onValue(ref(db,"chatMeta"),s=>{CM=s.val()||{};if(TAB=="chats"){if(!CHATOPEN)render();else if(document.activeElement&&document.activeElement.id!="areply"){}}drawTabs();if(TAB=="over")render()},()=>{}));
 live.push(onValue(ref(db,"profiles"),s=>{PROF=s.val()||{};if(TAB=="over"||(TAB=="users"&&!(document.activeElement&&document.activeElement.id=="uq")))render()},()=>{}));
 live.push(onValue(ref(db,"subs"),s=>{SUBS=s.val()||{};if(TAB=="over"||(TAB=="users"&&!(document.activeElement&&document.activeElement.id=="uq")))render()},()=>{}));
});
