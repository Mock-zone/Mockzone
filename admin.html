 banners:()=>`<div class="mu" style="margin-bottom:10px">Shown on the home screen (swipes every 2 seconds). Image should be 16:9. Leave image empty to use the gradient.</div>`+S.banners.map((b,i)=>{const p=`banners.${i}`,g=(b.c||"#7c5ce6,#b09bf5").split(",");return `<div class="card"><div class="row"><b>Banner ${i+1}</b><span class="sp"></span>${ctrl("banners",i,S.banners.length)}</div><div class="gp" style="background:linear-gradient(135deg,${e(g[0])},${e(g[1]||g[0])})"></div><div class="g3">${lab("Title",inp(p+".title",b.title))}${lab("Subtitle",inp(p+".sub",b.sub))}</div><div class="g3">${lab("Tap link",inp(p+".link",b.link,"https://…"))}${lab("Image URL (16:9)",inp(p+".img",b.img,"https://…"))}</div><div class="g3"><label class="lb"><span>Gradient start</span><input class="f" type="color" data-p="${p}.c" data-g="0" value="${e(g[0])}"></label><label class="lb"><span>Gradient end</span><input class="f" type="color" data-p="${p}.c" data-g="1" value="${e(g[1]||g[0])}"></label></div></div>`}).join("")+addBtn("banners","banner","Add banner"),
 subjects:()=>`<div class="mu" style="margin-bottom:10px">Add, rename, reorder or delete subjects and their chapters. A chapter with a link opens that mock test link; without a link it opens the built-in practice set.</div>`+S.subjects.map((s,i)=>{const p=`subjects.${i}`;return det(p,`<span class="em">${e(s.e)}</span> ${e(s.n)}<small>${s.ch.length} chapters</small>`,ctrl("subjects",i,S.subjects.length),`<div class="g3">${lab("Subject name",inp(p+".n",s.n))}${lab("Emoji",inp(p+".e",s.e))}${lab("Card color",inp(p+".c",s.c,"",{type:"color"}))}</div><h4>Chapters</h4>`+chEd(p+".ch"))}).join("")+addBtn("subjects","subject","Add subject"),
 full:()=>`<div class="mu" style="margin-bottom:10px">Full mock tests shown on Home. Each test opens its link when tapped. Tick "Free" for tests Free-plan users can open.</div>`+S.full.map((x,i)=>{const p=`full.${i}`;return det(p,`<span class="em">${e(x.e)}</span> ${e(x.n)}<small>${x.tests.length} mocks</small>`,ctrl("full",i,S.full.length),`<div class="g3">${lab("Exam name",inp(p+".n",x.n))}${lab("Emoji",inp(p+".e",x.e))}</div><h4>Mock tests</h4>`+testsEd(p+".tests"))}).join("")+addBtn("full","fexam","Add exam"),
 pyq:()=>`<div class="mu" style="margin-bottom:10px">Exam → Tier → Series (e.g. Year-wise) → Papers. Each paper opens its link when tapped.</div>`+S.pyq.map((x,i)=>{const p=`pyq.${i}`;return det(p,`<span class="em">${e(x.e)}</span> ${e(x.n)}<small>${x.tiers.length} tiers</small>`,ctrl("pyq",i,S.pyq.length),`<div class="g3">${lab("Exam name",inp(p+".n",x.n))}${lab("Emoji",inp(p+".e",x.e))}</div><h4>Tiers</h4>`+x.tiers.map((t,j)=>{const tp=`${p}.tiers.${j}`;return det(tp,e(t.n)+`<small>${t.secs.length} series</small>`,ctrl(p+".tiers",j,x.tiers.length),`${lab("Tier name",inp(tp+".n",t.n))}`+t.secs.map((s,k)=>{const sp=`${tp}.secs.${k}`;return det(sp,e(s.n)+`<small>${s.tests.length} papers</small>`,ctrl(tp+".secs",k,t.secs.length),`${lab("Series name",inp(sp+".n",s.n))}`+testsEd(sp+".tests"))}).join("")+addBtn(tp+".secs","sec","Add series"))}).join("")+addBtn(p+".tiers","tier","Add tier"))}).join("")+addBtn("pyq","pexam","Add exam"),
 plans:()=>`<div class="mu" style="margin-bottom:10px">Plans shown on the Upgrade screen. Duration (days) is the default time a user gets when you approve a payment for that plan.</div>`+S.plans.map((x,i)=>{const p=`plans.${i}`;return `<div class="card"><div class="row"><b>${e(x.e)} ${e(x.n)}</b><span class="sp"></span>${x.id=="free"?"":ctrl("plans",i,S.plans.length)}</div><div class="g3">${lab("Name",inp(p+".n",x.n))}${lab("Price ₹",inp(p+".pr",x.pr,"",{t:"n",type:"number",min:0}))}${lab("Validity label",inp(p+".v",x.v,"e.g. 2 Months"))}</div><div class="g3">${lab("Duration (days)",inp(p+".days",x.days||0,"",{t:"n",type:"number",min:0}))}${lab("Emoji",inp(p+".e",x.e))}${lab("Color",inp(p+".c",x.c,"",{type:"color"}))}</div><label class="chk"><input type="checkbox" data-t="b" data-p="${p}.best" ${x.best?"checked":""}>Show “Best value” ribbon</label>${lab("Features (one per line)",`<textarea class="f" rows="5" data-t="lines" data-p="${p}.f">${e((x.f||[]).join("\n"))}</textarea>`)}<div class="mu">Plan ID: <code>${e(x.id)}</code></div></div>`}).join("")+addBtn("plans","plan","Add plan"),
 settings:()=>`<div class="card"><h3>UPI payment details</h3><div class="g3">${lab("UPI ID",inp("pay.upiId",S.pay.upiId))}${lab("Payee name",inp("pay.payee",S.pay.payee))}${lab("Mobile",inp("pay.mobile",S.pay.mobile))}</div>${`<div class="lb"><span>QR code</span><img class="qrp" id="qrp" ${S.pay.qr?`src="${e(S.pay.qr)}"`:'alt="Using the QR built into the app" style="display:none"'}>${S.pay.qr?"":'<div class="mu">Using the QR code built into the app.</div>'}<div class="acts"><label class="ghost" style="cursor:pointer">Upload QR image<input type="file" accept="image/*" data-f="qr" hidden></label>${S.pay.qr?'<button class="danger" data-a="clrqr">Use built-in QR</button>':""}</div></div>`}</div><div class="card"><h3>Free plan</h3>${lab("Free practice tests per day",inp("settings.freeLimit",S.settings.freeLimit,"",{t:"n",type:"number",min:0}))}</div>`
};
function contentTab(){
 const note=SEEDED?"":`<div class="note">Firebase has no content yet, so you're seeing the app's built-in defaults. Press <b>Save</b> once to publish everything to Firebase; after that the app reads everything from here.</div>`;
 return `${note}<div class="savebar ${DIRTY[TAB]?"un":""}" id="sbar"><span class="s">${DIRTY[TAB]?"Unsaved changes":"All changes saved"}</span><button class="pri" data-a="save">Save to Firebase</button></div>`+T[TAB]()}
async function save(){
 const secs=SEEDED?SECS[TAB]:["banners","subjects","full","pyq","plans","pay","settings"],up={};
 secs.forEach(s=>{up["content/"+s]=clean(S[s])});up["content/meta"]={seeded:true,updatedAt:Date.now()};
 try{await update(ref(db),up);SEEDED=true;DIRTY[TAB]=0;toast("Saved ✓ – app updates instantly");render()}catch(x){toast(x.code=="PERMISSION_DENIED"?"Permission denied – check database rules / admin UID":"Save failed: "+x.message)}}
const markDirty=()=>{if(!SECS[TAB])return;DIRTY[TAB]=1;const b=$("#sbar");if(b){b.classList.add("un");b.firstElementChild.textContent="Unsaved changes"}};

/* ---------- payments ---------- */
const defDays=r=>{const p=S.plans.find(x=>x.id==r.pid);return p&&p.days||30};
function payList(){
 const q=PQ.trim().toLowerCase();
 const l=PR.filter(r=>(PF=="all"||r.status==PF)&&(!q||[r.uid,r.email,r.name,r.utr,r.plan].some(x=>String(x||"").toLowerCase().includes(q))));
 if(!l.length)return `<div class="card mu" style="text-align:center">No ${PF=="all"?"":PF+" "}payment requests</div>`;
 return l.map(r=>{const st=r.status;return `<div class="card"><div class="row"><b>${e(r.name||"User")}</b><span class="tag ${st=="approved"?"ok":st=="rejected"?"bad":"w"}">${e(String(st).toUpperCase())}</span><span class="sp"></span><span class="mu">${fmt(r.ts)}</span></div>
 <div class="kv"><b>Email</b>${e(r.email)}</div>
 <div class="kv"><b>UID</b><code>${e(r.uid)}</code><button class="cp" data-a="cp" data-v="${e(r.uid)}">copy</button></div>
 <div class="kv"><b>Plan</b>${e(r.plan)} · <b style="color:var(--tx)">₹${e(r.amt)}</b></div>
 <div class="kv"><b>UTR</b><code>${e(r.utr)}</code><button class="cp" data-a="cp" data-v="${e(r.utr)}">copy</button></div>
 ${st=="approved"&&r.exp?`<div class="kv"><b>Valid till</b>${fmtD(r.exp)}</div>`:""}
 ${st=="pending"?`<div class="acts"><button class="good" data-a="appr" data-id="${e(r.id)}">Approve · ${defDays(r)} days</button><button class="ghost" data-a="custom" data-id="${e(r.id)}">Custom duration…</button><button class="danger" data-a="rej" data-id="${e(r.id)}">Reject</button></div>`:""}</div>`}).join("")}
function payTab(){
 const c=s=>PR.filter(r=>r.status==s).length;
 return `<div class="chips">${[["pending","Pending "+c("pending")],["approved","Approved"],["rejected","Rejected"],["all","All"]].map(x=>`<button data-a="pf" data-v="${x[0]}" class="${PF==x[0]?"on":""}">${x[1]}</button>`).join("")}</div><input class="f" id="pq" placeholder="Search by UID, email, name or UTR" value="${e(PQ)}" style="margin-bottom:12px"><div id="plist">${payList()}</div>`}
async function doApprove(r,n,u,ask){
 const sub=SUBS[r.uid],now=Date.now(),base=sub&&sub.exp>now&&sub.id==r.pid?sub.exp:now,exp=addDur(base,n,u);
 if(ask&&!confirm(`Approve ${r.plan} for ${r.name||r.email}?\nAccess valid till ${fmtD(exp)}${base>now?" (added to current plan)":""}.`))return false;
 const up={};up[`subs/${r.uid}`]={id:r.pid,exp,since:now,by:ME.uid};
 for(const b of [`paymentRequests/${r.id}`,`payments/${r.uid}/${r.id}`]){up[b+"/status"]="approved";up[b+"/approvedAt"]=now;up[b+"/exp"]=exp}
 try{await update(ref(db),up);toast("Approved ✓ valid till "+fmtD(exp));return true}catch(x){toast("Failed: "+x.message);return false}}
async function doReject(r){
 if(!confirm(`Reject this payment from ${r.name||r.email}?`))return;
 const up={};for(const b of [`paymentRequests/${r.id}`,`payments/${r.uid}/${r.id}`]){up[b+"/status"]="rejected";up[b+"/rejectedAt"]=Date.now()}up["utrs/"+r.utr]=null;
 try{await update(ref(db),up);toast("Rejected")}catch(x){toast("Failed: "+x.message)}}
function durModal(title,sub,plans,defId,onOk){
 const d0=(plans.find(p=>p.id==defId)||plans[0]||{}).days||30;
 const m=modal(`<h3>${title}</h3><div class="mu">${sub}</div>${plans.length>1||!defId?`<label>Plan</label><select class="f" id="dp">${plans.map(p=>`<option value="${e(p.id)}" ${p.id==defId?"selected":""}>${e(p.n)} · ₹${e(p.pr)}</option>`).join("")}</select>`:""}
 <label>Duration</label><div class="two"><input class="f" id="dn" type="number" min="1" value="${d0}"><select class="f" id="du"><option value="days">Days</option><option value="months">Months</option><option value="years">Years</option></select></div>
 <div class="mrow"><button class="ghost" data-x="cancel">Cancel</button><button class="pri" id="dok">Confirm</button></div>`);
 const dp=m.querySelector("#dp");if(dp)dp.onchange=()=>{m.querySelector("#dn").value=(plans.find(p=>p.id==dp.value)||{}).days||30;m.querySelector("#du").value="days"};
 m.querySelector("#dok").onclick=async()=>{const n=Math.floor(+m.querySelector("#dn").value);if(!(n>0))return toast("Enter a valid duration");if(await onOk(dp?dp.value:defId,n,m.querySelector("#du").value))m.remove()}}

/* ---------- users ---------- */
function usersTab(){
 const ids=[...new Set([...Object.keys(PROF),...Object.keys(SUBS)])],q=UQ.trim().toLowerCase(),now=Date.now();
 const l=ids.map(id=>({id,...(PROF[id]||{}),sub:SUBS[id]})).filter(u=>!q||[u.id,u.email,u.name].some(x=>String(x||"").toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 return `<div class="card"><h3>Give subscription by UID</h3><div class="row"><input class="f" id="gu" placeholder="Paste user UID" style="flex:1;min-width:200px"><button class="pri" data-a="grantuid">Continue</button></div></div>
 <input class="f" id="uq" placeholder="Search users by name, email or UID" value="${e(UQ)}" style="margin-bottom:12px"><div id="ulist">${userList(l,now)}</div>`}
function userList(l,now){
 if(!l.length)return `<div class="card mu" style="text-align:center">No users found</div>`;
 return l.slice(0,200).map(u=>{const a=u.sub&&u.sub.exp>now;return `<div class="card"><div class="row"><b>${e(u.name||"(no name)")}</b><span class="tag ${a?"ok":""}">${a?e(planName(u.sub.id)):"Free"}</span><span class="sp"></span>${a?`<span class="mu">till ${fmtD(u.sub.exp)}</span>`:u.sub?`<span class="mu">expired ${fmtD(u.sub.exp)}</span>`:""}</div>
 <div class="kv"><b>Email</b>${e(u.email||"-")}</div><div class="kv"><b>UID</b><code>${e(u.id)}</code><button class="cp" data-a="cp" data-v="${e(u.id)}">copy</button></div>
 <div class="acts"><button class="ghost" data-a="grant" data-id="${e(u.id)}">Give / change plan</button>${u.sub?`<button class="danger" data-a="revoke" data-id="${e(u.id)}">Remove plan</button>`:""}</div></div>`}).join("")}
function grant(uid){
 const plans=S.plans.filter(p=>p.id!="free");if(!plans.length)return toast("Create a paid plan first");
 const u=PROF[uid]||{};
 durModal("Give subscription",`${e(u.name||"")} <code>${e(uid)}</code>`,plans,plans[0].id,async(pid,n,un)=>{
  const sub=SUBS[uid],now=Date.now(),base=sub&&sub.exp>now&&sub.id==pid?sub.exp:now,exp=addDur(base,n,un);
  if(!confirm(`Give ${planName(pid)} until ${fmtD(exp)}?`))return false;
  try{await set(ref(db,"subs/"+uid),{id:pid,exp,since:now,by:ME.uid});toast("Plan given ✓");return true}catch(x){toast("Failed: "+x.message);return false}})}

/* ---------- render + events ---------- */
const TABS=[["payments","Payments"],["users","Users"],["banners","Banners"],["subjects","Subjects & chapters"],["full","Full mocks"],["pyq","PYQ"],["plans","Plans"],["settings","Payment & settings"]];
function drawTabs(){const pend=PR.filter(r=>r.status=="pending").length;$("#tabs").innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${TAB==t[0]?"on":""}">${t[1]}${t[0]=="payments"&&pend?`<i>${pend}</i>`:""}</button>`).join("");document.documentElement.style.setProperty("--hh",$("#hdr").offsetHeight+8+"px")}
function render(){if(!S)return;const y=scrollY;drawTabs();$("#main").innerHTML=TAB=="payments"?payTab():TAB=="users"?usersTab():contentTab();scrollTo(0,y)}
$("#tabs").onclick=async ev=>{const b=ev.target.closest("[data-tab]");if(!b)return;if(DIRTY[TAB]&&!confirm("You have unsaved changes in this tab. Leave anyway?"))return;if(DIRTY[TAB]){DIRTY[TAB]=0;try{await reload()}catch(x){}}TAB=b.dataset.tab;scrollTo(0,0);render()};
const main=$("#main");
main.addEventListener("toggle",ev=>{const d=ev.target;if(d.dataset&&d.dataset.d)d.open?OPEN.add(d.dataset.d):OPEN.delete(d.dataset.d)},true);
main.addEventListener("input",ev=>{const t=ev.target;
 if(t.id=="pq"){PQ=t.value;$("#plist").innerHTML=payList();return}
 if(t.id=="uq"){UQ=t.value;const ids=[...new Set([...Object.keys(PROF),...Object.keys(SUBS)])],q=UQ.trim().toLowerCase();$("#ulist").innerHTML=userList(ids.map(id=>({id,...(PROF[id]||{}),sub:SUBS[id]})).filter(u=>!q||[u.id,u.email,u.name].some(x=>String(x||"").toLowerCase().includes(q))),Date.now());return}
 const p=t.dataset.p;if(!p)return;let v;
 if(t.type=="checkbox")v=t.dataset.t=="b"?(t.checked?1:0):t.checked;
 else if(t.dataset.t=="n")v=t.value===""?0:+t.value;
 else if(t.dataset.t=="lines")v=t.value.split("\n").map(x=>x.trim()).filter(Boolean);
 else v=t.value;
 if(t.dataset.g!=null){const a=(get_(p)||"#7c5ce6,#b09bf5").split(",");a[+t.dataset.g]=t.value;if(a.length<2)a[1]=a[0];v=a.join(",");const g=t.closest(".card").querySelector(".gp");if(g)g.style.background=`linear-gradient(135deg,${a[0]},${a[1]})`}
 setAt(p,v);markDirty()});
main.addEventListener("change",ev=>{const t=ev.target;if(t.dataset.f!="qr"||!t.files[0])return;
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);S.pay.qr=c.toDataURL("image/jpeg",.9);markDirty();render()};im.onerror=()=>toast("Could not read that image");im.src=fr.result};fr.readAsDataURL(t.files[0])});
main.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;ev.preventDefault();const a=b.dataset.a,p=b.dataset.p,i=+b.dataset.i;
 if(a=="cp")return copy(b.dataset.v);
 if(a=="pf"){PF=b.dataset.v;return render()}
 if(a=="save")return save();
 if(a=="clrqr"){S.pay.qr="";markDirty();return render()}
 if(a=="add"){get_(p).push(NEW[b.dataset.k]());markDirty();return render()}
 if(a=="up"||a=="down"){const arr=get_(p),j=a=="up"?i-1:i+1;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];markDirty();return render()}
 if(a=="del"){const arr=get_(p),o=arr[i];if(!confirm(`Delete "${o.n||o.t||o.title||"this item"}"?`))return;arr.splice(i,1);markDirty();return render()}
 if(a=="bulk"){const k=b.dataset.k,arr=get_(p);
  const m=modal(`<h3>Bulk add ${k=="test"?"tests":"chapters"}</h3><div class="mu">One per line: <code>${k=="test"?"Title | link | free":"Chapter name | link"}</code><br>${k=="test"?"“free” is optional. A line with only a link is named Mock Test 1, 2…":"Link is optional."}</div><textarea class="f" id="bk" rows="9" style="margin-top:10px" placeholder="${k=="test"?"CGL Mock 1 | https://… | free\nCGL Mock 2 | https://…":"Percentage\nProfit & Loss | https://…"}"></textarea><div class="mrow"><button class="ghost" data-x="cancel">Cancel</button><button class="pri" id="bok">Add</button></div>`);
  m.querySelector("#bok").onclick=()=>{let n=0;m.querySelector("#bk").value.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(x=>x[0]).forEach(x=>{
    if(k=="test"){const isU=/^https?:\/\//i.test(x[0])&&x.length==1;arr.push({t:isU?"Mock Test "+(arr.length+1):x[0],url:isU?x[0]:(x[1]||""),q:100,m:60,free:/free/i.test(x[2]||"")})}
    else arr.push({n:x[0],url:x[1]||""});n++});
   m.remove();if(n){markDirty();render();toast(n+" added")}};return}
 const id=b.dataset.id,r=PR.find(x=>x.id==id);
 if(a=="appr"&&r)return doApprove(r,defDays(r),"days");
 if(a=="rej"&&r)return doReject(r);
 if(a=="custom"&&r)return durModal("Approve with custom duration",`${e(r.name||r.email)} · ${e(r.plan)} · ₹${e(r.amt)}`,[{id:r.pid,n:r.plan,pr:r.amt,days:defDays(r)}],r.pid,(pid,n,u)=>doApprove(r,n,u,true));
 if(a=="grant")return grant(id);
 if(a=="grantuid"){const u=$("#gu").value.trim();if(u.length<6)return toast("Paste a valid UID");return grant(u)}
 if(a=="revoke"){if(!confirm("Remove this user's plan (back to Free)?"))return;set(ref(db,"subs/"+id),null).then(()=>toast("Plan removed"),x=>toast("Failed: "+x.message))}});
addEventListener("beforeunload",ev=>{if(Object.values(DIRTY).some(Boolean)){ev.preventDefault();ev.returnValue=""}});

/* ---------- auth + data ---------- */
function showLogin(m){$("#app").hidden=true;$("#login").hidden=false;$("#lerr").textContent=m||""}
$("#lf").onsubmit=async ev=>{ev.preventDefault();$("#lerr").textContent="";const em=$("#le").value.trim(),pw=$("#lp").value;if(!em||!pw)return $("#lerr").textContent="Enter email and password.";
 try{await Au.signInWithEmailAndPassword(auth,em,pw)}catch(x){$("#lerr").textContent=["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(x.code)?"Wrong email or password.":x.code=="auth/operation-not-allowed"?"Enable Email/Password sign-in in Firebase Authentication first.":x.message}};
$("#out").onclick=()=>Au.signOut(auth);
async function reload(){const s=await get(ref(db,"content"));S=build(s.val())}
Au.onAuthStateChanged(auth,async u=>{
 live.forEach(f=>f());live=[];ME=null;S=null;
 if(!u){showLogin(LASTMSG);LASTMSG="";return}
 let ok=false;try{await get(ref(db,"paymentRequests"));ok=true}catch(x){}
 if(!ok){LASTMSG=`This account is not an admin yet.\nYour UID: ${u.uid}\nIn Firebase → Realtime Database, add  admins → ${u.uid} = true  then sign in again.`;return Au.signOut(auth)}
 ME=u;$("#who").textContent=u.email;
 try{await reload()}catch(x){LASTMSG="Could not load content: "+x.message;return Au.signOut(auth)}
 $("#login").hidden=true;$("#app").hidden=false;render();
 live.push(onValue(ref(db,"paymentRequests"),s=>{PR=[];s.forEach(c=>{PR.push(c.val())});PR.sort((a,b)=>b.ts-a.ts);
   if(TAB=="payments"){document.activeElement&&document.activeElement.id=="pq"?($("#plist").innerHTML=payList(),drawTabs()):render()}else drawTabs()},x=>toast("Can't read payments: "+x.code)));
 live.push(onValue(ref(db,"profiles"),s=>{PROF=s.val()||{};if(TAB=="users"&&!(document.activeElement&&document.activeElement.id=="uq"))render()},()=>{}));
 live.push(onValue(ref(db,"subs"),s=>{SUBS=s.val()||{};if(TAB=="users"&&!(document.activeElement&&document.activeElement.id=="uq"))render()},()=>{}));
});
$("#lerr").style.whiteSpace="pre-line";
</script></body></html>
